name: lint

# Static checks only. There is no integration test here and there cannot
# usefully be one: this project's whole job is to attach a physical disk to
# WSL2, reformat it, and install Docker inside a Windows Subsystem for Linux
# distro. None of that is reproducible on a hosted runner, so pretending
# otherwise with a green tick would be worse than having no test at all.
#
# What this DOES catch is worth having. Two real functional bugs in this repo
# were found by exactly these tools rather than by testing:
#   - Six variables (IMAGE_SIZE, IMAGE_STEPS, VIDEO_*) computed from the
#     machine's VRAM and then never used, so GPU tiering silently did nothing
#     for image generation.
#   - A malformed `# shellcheck disable=` directive which made shellcheck stop
#     analysing the rest of install.sh, hiding the above.
# Plus a PowerShell variable-name collision ($action vs the $Action parameter)
# that broke scheduled-task registration.

on:
  # Every branch, not just the default one. A linter that only runs after a
  # merge tells you about problems too late to be useful - and the first
  # version of this file ran on nothing at all, because it was pushed to a
  # feature branch that matched none of its own triggers.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          shellcheck --version

      - name: Check syntax parses
        run: |
          fail=0
          for f in *.sh; do
            if ! bash -n "$f"; then echo "::error file=$f::bash -n failed"; fail=1; fi
          done
          exit $fail

      - name: shellcheck (errors and warnings are fatal)
        run: shellcheck --severity=warning --format=gcc *.sh

      - name: shellcheck (style, advisory only)
        continue-on-error: true
        run: shellcheck --severity=style --format=gcc *.sh

  powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        # Retried, because a bare Install-Module is not reliable: the PowerShell
        # Gallery intermittently answers "No match was found for the specified
        # search criteria and module name 'PSScriptAnalyzer'" even though the
        # module obviously exists. Seen live - the same commit failed on one run
        # and passed on another minutes later. A lint badge that fails at random
        # trains you to ignore it, which is worse than having no badge.
        run: |
          $ErrorActionPreference = 'Stop'
          # NuGet provider and an explicitly-trusted gallery, so nothing waits on
          # an interactive "are you sure" prompt that can never be answered here.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          $installed = $false
          foreach ($attempt in 1..4) {
            try {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
              $installed = $true
              break
            } catch {
              Write-Host "Attempt ${attempt} failed: $($_.Exception.Message)"
              if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $installed) { throw "PSScriptAnalyzer could not be installed after 4 attempts." }
          Import-Module PSScriptAnalyzer
          "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) ready."

      - name: Check every script parses
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              $failed = $true
              foreach ($e in $errs) {
                Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (errors and warnings are fatal)
        shell: pwsh
        run: |
          # Three rules are excluded, each for a stated reason. Everything else
          # is fatal - the point is to catch real defects, and it already has
          # (an $action/$Action collision that broke task registration, and two
          # empty catch blocks that were discarding diagnosable failures).
          #
          # PSAvoidUsingWriteHost: these are interactive, operator-facing
          #   scripts whose job is to narrate progress to a human watching a
          #   console. Write-Host is the correct tool, not a smell.
          # PSAvoidUsingPlainTextForPassword / ConvertToSecureStringWithPlainText:
          #   mount.cifs accepts nothing but a plaintext credentials file. There
          #   is no secure variant to migrate to. That file is mode 600 and is
          #   shredded on eject; see SECURITY.md.
          # PSUseShouldProcessForStateChangingFunctions: fires on two internal
          #   helpers in disconnect.ps1 (Stop-DockerDesktop,
          #   Start-DockerDesktopIfNeeded). They are script-local, never
          #   exported, and Stop-DockerDesktop already gates on explicit user
          #   consent via a dialog - so -WhatIf/-Confirm plumbing would add
          #   ceremony without adding a safety property the code lacks.
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingPlainTextForPassword,PSAvoidUsingConvertToSecureStringWithPlainText,PSUseShouldProcessForStateChangingFunctions
          if ($results) {
            $results | ForEach-Object {
              Write-Host "::error file=$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)"
            }
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer clean."

  python:
    name: python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile
        # Syntax only. These scripts import open_webui, which exists only inside
        # the running container, so they cannot be imported or executed here.
        run: python -m compileall -q $(ls *.py) && echo "python syntax OK"
